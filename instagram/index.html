<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Back to Rosace</title>
<link rel="stylesheet" href="../style.css">
<style>
  body { min-height: 90vh; display: grid; place-items: center; text-align: center; }
  main { max-width: 32em; padding: 24px; }
  .small { opacity: .75; font-size: .9em; }
</style>
</head>
<body>
<main>
  <h1>Taking you back to Rosace…</h1>
  <p class="small">Instagram signed you in. This page hands the one-time sign-in code to the Rosace app on your computer and keeps nothing.</p>
  <p class="small" id="manual" hidden>If nothing happens, make sure Rosace is open, then <a id="back" href="#">click here</a>.</p>
</main>
<script>
  // Instagram only returns people to a registered web address, so it sends them here. This page passes the code
  // straight on to Rosace running on this computer. The code is useless without Rosace's private app key.
  (function () {
    var query = window.location.search;  // ?code=…&state=… or ?error=…; the trailing "#_" is in the hash and not passed on
    var target = "http://127.0.0.1:8765/api/instagram/callback" + query;
    document.getElementById("back").href = target;
    setTimeout(function () { document.getElementById("manual").hidden = false; }, 2500);
    window.location.replace(target);  // replace, so the code doesn't stay in the browser's history
  })();
</script>
</body>
</html>
